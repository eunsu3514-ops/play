<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DDAS | 실시간 직무·학과 Q&A 커넥트</title>
    <meta name="description" content="현직자와 선배가 들려주는 진짜 이야기. 학과와 직무에 대한 궁금증을 실시간으로 해결하세요.">
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts: Inter & Noto Sans KR -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header id="main-header">
        <nav class="container">
            <div class="logo">DDAS</div>
            <ul class="nav-links">
                <li><a href="#" class="nav-filter-btn active" data-category="all">전체</a></li>
                <li><a href="#" class="nav-filter-btn" data-category="dept">학과별 질문</a></li>
                <li><a href="#" class="nav-filter-btn" data-category="mentor">자격증 가이드</a></li>
                <li><a href="#" class="nav-filter-btn" data-category="alumni">선배 멘토링</a></li>
            </ul>
            <div class="header-actions">
                <button id="ask-btn" class="btn-primary">질문하기</button>
            </div>
        </nav>
    </header>

    <main>
        <section id="hero">
            <div class="container hero-content">
                <h1 class="fade-in">진짜 선배의<br><span class="highlight">실시간 답변.</span></h1>
                <p class="fade-in-delay">관심 있는 학과나 직무를 선택하고 지금 바로 질문하세요.</p>
                <div class="search-bar fade-in-delay-2">
                    <input type="text" id="search-input" placeholder="어떤 직무나 학과가 궁금하신가요?">
                </div>
            </div>
        </section>

        <section id="qna-section" class="container">
            <!-- Filter controls removed from here -->

            <!-- Organized Faculty & Department Sub-Filter -->
            <div id="sub-filter-container" class="sub-filter-grid hidden">
                <div class="search-suggestions-wrapper">
                    <div id="search-suggestions" class="suggestions-dropdown hidden"></div>
                </div>
                
                <div class="faculty-accordion">
                    <!-- 기계공학부 -->
                    <div class="faculty-item">
                        <div class="faculty-header">
                            <span>기계공학부</span>
                            <i class="arrow"></i>
                        </div>
                        <div class="faculty-content">
                            <button class="sub-filter-btn" data-dept="기계공학과">기계공학과</button>
                            <button class="sub-filter-btn" data-dept="기계설계공학과">기계설계공학과</button>
                        </div>
                    </div>

                    <!-- 로봇자동화공학부 -->
                    <div class="faculty-item">
                        <div class="faculty-header">
                            <span>로봇자동화공학부</span>
                            <i class="arrow"></i>
                        </div>
                        <div class="faculty-content">
                            <button class="sub-filter-btn" data-dept="로봇소프트웨어과">로봇소프트웨어과</button>
                            <button class="sub-filter-btn" data-dept="로봇자동화공학과">로봇자동화공학과</button>
                        </div>
                    </div>

                    <!-- 전기전자통신공학부 -->
                    <div class="faculty-item">
                        <div class="faculty-header">
                            <span>전기전자통신공학부</span>
                            <i class="arrow"></i>
                        </div>
                        <div class="faculty-content">
                            <button class="sub-filter-btn" data-dept="전기공학과">전기공학과</button>
                            <button class="sub-filter-btn" data-dept="정보전자공학과">정보전자공학과</button>
                            <button class="sub-filter-btn" data-dept="반도체전자공학과">반도체전자공학과</button>
                            <button class="sub-filter-btn" data-dept="정보통신공학과">정보통신공학과</button>
                        </div>
                    </div>

                    <!-- 컴퓨터공학부 -->
                    <div class="faculty-item">
                        <div class="faculty-header">
                            <span>컴퓨터공학부</span>
                            <i class="arrow"></i>
                        </div>
                        <div class="faculty-content">
                            <button class="sub-filter-btn" data-dept="컴퓨터정보공학과">컴퓨터정보공학과</button>
                            <button class="sub-filter-btn" data-dept="컴퓨터소프트웨어공학과">컴퓨터소프트웨어공학과</button>
                            <button class="sub-filter-btn" data-dept="웹응용소프트웨어공학과">웹응용소프트웨어공학과</button>
                            <button class="sub-filter-btn" data-dept="인공지능소프트웨어학과">인공지능소프트웨어학과</button>
                        </div>
                    </div>

                    <!-- 생활환경공학부 -->
                    <div class="faculty-item">
                        <div class="faculty-header">
                            <span>생활환경공학부</span>
                            <i class="arrow"></i>
                        </div>
                        <div class="faculty-content">
                            <button class="sub-filter-btn" data-dept="생명화학공학과">생명화학공학과</button>
                            <button class="sub-filter-btn" data-dept="바이오융합공학과">바이오융합공학과</button>
                            <button class="sub-filter-btn" data-dept="건축과">건축과</button>
                            <button class="sub-filter-btn" data-dept="실내건축디자인과">실내건축디자인과</button>
                        </div>
                    </div>

                    <!-- 디자인학부 -->
                    <div class="faculty-item">
                        <div class="faculty-header">
                            <span>디자인학부</span>
                            <i class="arrow"></i>
                        </div>
                        <div class="faculty-content">
                            <button class="sub-filter-btn" data-dept="시각디자인과">시각디자인과</button>
                            <button class="sub-filter-btn" data-dept="AR·VR콘텐츠디자인과">AR·VR콘텐츠디자인과</button>
                        </div>
                    </div>

                    <!-- 경영학부 -->
                    <div class="faculty-item">
                        <div class="faculty-header">
                            <span>경영학부</span>
                            <i class="arrow"></i>
                        </div>
                        <div class="faculty-content">
                            <button class="sub-filter-btn" data-dept="경영학과">경영학과</button>
                            <button class="sub-filter-btn" data-dept="세무회계학과">세무회계학과</button>
                            <button class="sub-filter-btn" data-dept="유통마케팅학과">유통마케팅학과</button>
                            <button class="sub-filter-btn" data-dept="호텔관광학과">호텔관광학과</button>
                            <button class="sub-filter-btn" data-dept="경영정보학과">경영정보학과</button>
                            <button class="sub-filter-btn" data-dept="빅데이터경영과">빅데이터경영과</button>
                        </div>
                    </div>

                    <!-- 자유전공 -->
                    <div class="faculty-item">
                        <div class="faculty-header">
                            <span>자유전공</span>
                            <i class="arrow"></i>
                        </div>
                        <div class="faculty-content">
                            <button class="sub-filter-btn" data-dept="자유전공학과">자유전공학과</button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="qna-list" class="qna-grid">
                <!-- Q&A Items will be injected here -->
                <div class="loading-skeleton"></div>
            </div>
        </section>
    </main>

    <!-- Modal for Posting Question -->
    <div id="modal-overlay" class="hidden">
        <div class="modal">
            <header>
                <h2>새 질문 작성</h2>
                <button id="close-modal">&times;</button>
            </header>
            <form id="qna-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="category">분류</label>
                        <select id="category" required>
                            <option value="dept">학과 (전공)</option>
                            <option value="job">직무 (커리어)</option>
                        </select>
                    </div>
                    <div class="form-group" id="dept-select-group">
                        <label for="department-name">관련 학과</label>
                        <select id="department-name" required>
                            <option value="">학과를 선택하세요</option>
                            <optgroup label="기계공학부 (2년제)">
                                <option value="기계공학과">기계공학과</option>
                                <option value="기계설계공학과">기계설계공학과</option>
                            </optgroup>
                            <optgroup label="로봇자동화공학부">
                                <option value="로봇공학과">로봇공학과 (3년제)</option>
                                <option value="로봇소프트웨어과">로봇소프트웨어과 (2년제)</option>
                            </optgroup>
                            <optgroup label="전기전자통신공학부">
                                <option value="전기공학과">전기공학과 (2년제)</option>
                                <option value="정보전자공학과">정보전자공학과 (2년제)</option>
                                <option value="반도체전자공학과">반도체전자공학과 (3년제)</option>
                                <option value="정보통신공학과">정보통신공학과 (2년제)</option>
                            </optgroup>
                            <optgroup label="컴퓨터공학부 (2년제)">
                                <option value="컴퓨터정보공학과">컴퓨터정보공학과</option>
                                <option value="컴퓨터소프트웨어공학과">컴퓨터소프트웨어공학과</option>
                                <option value="웹응용소프트웨어공학과">웹응용소프트웨어공학과</option>
                                <option value="인공지능소프트웨어학과">인공지능소프트웨어학과</option>
                            </optgroup>
                            <optgroup label="생활환경공학부 (2년제)">
                                <option value="생명화학공학과">생명화학공학과</option>
                                <option value="바이오융합공학과">바이오융합공학과</option>
                                <option value="건축과">건축과</option>
                                <option value="실내건축디자인과">실내건축디자인과</option>
                            </optgroup>
                            <optgroup label="디자인학부 (2년제)">
                                <option value="시각디자인과">시각디자인과</option>
                                <option value="AR·VR콘텐츠디자인과">AR·VR콘텐츠디자인과</option>
                            </optgroup>
                            <optgroup label="경영학부 (2년제)">
                                <option value="경영학과">경영학과</option>
                                <option value="세무회계학과">세무회계학과</option>
                                <option value="유통마케팅학과">유통마케팅학과</option>
                                <option value="호텔관광학과">호텔관광학과</option>
                                <option value="경영정보학과">경영정보학과</option>
                                <option value="빅데이터경영과">빅데이터경영과</option>
                            </optgroup>
                            <option value="자유전공학과">자유전공학과 (2년제)</option>
                            <option value="학교생활">기타 학교생활 (동아리/연애/학식 등)</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="title">제목</label>
                    <input type="text" id="title" placeholder="궁금한 내용을 요약해주세요" required>
                </div>
                <div class="form-group">
                    <label for="content">내용</label>
                    <textarea id="content" rows="5" placeholder="현직자와 선배가 자세히 답해드릴 수 있도록 구체적으로 적어주세요" required></textarea>
                </div>
                <div class="form-group">
                    <label for="author">작성자</label>
                    <input type="text" id="author" placeholder="닉네임" required>
                </div>
                <button type="submit" class="btn-submit">질문 등록하기</button>
            </form>
        </div>
    </div>

    <!-- Firebase SDK (Using v9 Compat for simplicity in script tag) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="app.js"></script>
</body>
</html>
