<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D-ARCHIVE | 동양미래대학교 실시간 Q&A 아카이브</title>
    <meta name="description" content="현직자와 선배가 들려주는 진짜 이야기. 학과와 직무에 대한 궁금증을 실시간으로 해결하세요.">
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts: Inter & Noto Sans KR -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header id="main-header">
        <nav class="container">
            <div class="logo-wrapper">
                <button id="header-back-btn" class="back-btn hidden">←</button>
                <img src="logo.png" alt="D-ARCHIVE LOGO" class="brand-logo">
                <div class="logo">D-ARCHIVE</div>
            </div>
            <ul class="nav-links">
                <li><a href="#" class="nav-filter-btn active" data-category="all">아카이브</a></li>
                <li><a href="#" class="nav-filter-btn" data-category="dept">학과별</a></li>
                <li><a href="#" class="nav-filter-btn" data-category="mentor">멘토가이드</a></li>
                <li><a href="https://www.dongyang.ac.kr" target="_blank" class="school-link">동양미래대학교 ↗</a></li>
            </ul>
            <div class="header-actions">
                <button id="ask-btn" class="btn-primary">질문 등록</button>
            </div>
        </nav>
    </header>

    <main>
        <section id="hero">
            <div class="container hero-content">
                <h1 class="bold">D-ARCHIVE</h1>
                <p class="slogan">OFFICIAL PRACTICAL DATABASE</p>
                <p class="brand-desc">동양미래대학교 학생들을 위한 <br><strong>전문 커리어 및 학술 지식 저장소</strong>입니다. <br>선배들과 전문가들의 실전 지식을 아카이빙하세요.</p>
                <div class="search-bar">
                    <input type="text" id="search-input" placeholder="아카이브 검색" aria-label="질문 검색">
                </div>
            </div>
        </section>

        <section id="qna-section" class="container">
            <div id="sub-filter-container" class="sub-filter-grid">
                <div class="faculty-accordion">
                    <!-- MECHANICAL -->
                    <div class="faculty-item">
                        <div class="faculty-header"><span>기계공학부</span></div>
                        <div class="faculty-content">
                            <button class="sub-filter-btn" data-dept="기계공학과">기계공학과</button>
                            <button class="sub-filter-btn" data-dept="기계설계공학과">기계설계공학과</button>
                        </div>
                    </div>

                    <!-- ROBOTICS -->
                    <div class="faculty-item">
                        <div class="faculty-header"><span>로봇자동화공학부</span></div>
                        <div class="faculty-content">
                            <button class="sub-filter-btn" data-dept="자동화공학과">자동화공학과</button>
                            <button class="sub-filter-btn" data-dept="로봇소프트웨어과">로봇소프트웨어과</button>
                        </div>
                    </div>

                    <!-- COMPUTING -->
                    <div class="faculty-item">
                        <div class="faculty-header"><span>컴퓨터소프트웨어공학부</span></div>
                        <div class="faculty-content">
                            <button class="sub-filter-btn" data-dept="웹응용소프트웨어공학과">웹응용소프트웨어공학과</button>
                            <button class="sub-filter-btn" data-dept="컴퓨터소프트웨어공학과">컴퓨터소프트웨어공학과</button>
                            <button class="sub-filter-btn" data-dept="인공지능소프트웨어학과">인공지능소프트웨어학과</button>
                        </div>
                    </div>

                    <!-- DESIGN -->
                    <div class="faculty-item">
                        <div class="faculty-header"><span>디자인학부</span></div>
                        <div class="faculty-content">
                            <button class="sub-filter-btn" data-dept="건축과">건축과</button>
                            <button class="sub-filter-btn" data-dept="실내건축디자인과">실내건축디자인과</button>
                            <button class="sub-filter-btn" data-dept="시각디자인과">시각디자인과</button>
                            <button class="sub-filter-btn" data-dept="AR·VR콘텐츠디자인과">AR·VR콘텐츠디자인과</button>
                        </div>
                    </div>

                    <!-- BUSINESS -->
                    <div class="faculty-item">
                        <div class="faculty-header"><span>경영학부</span></div>
                        <div class="faculty-content">
                            <button class="sub-filter-btn" data-dept="경영학과">경영학과</button>
                            <button class="sub-filter-btn" data-dept="세무회계학과">세무회계학과</button>
                            <button class="sub-filter-btn" data-dept="유통마케팅학과">유통마케팅학과</button>
                            <button class="sub-filter-btn" data-dept="호텔관광학과">호텔관광학과</button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="roadmap-display" class="roadmap-container hidden">
                <!-- Roadmap Info Injected Here -->
            </div>

            <div id="qna-list" class="qna-grid">
                <!-- Q&A Items will be injected here -->
            </div>
        </section>
    </main>

    <!-- Modal for Posting Question -->
    <div id="modal-overlay" class="hidden">
        <div class="modal">
            <header>
                <div class="modal-header-left">
                    <button id="modal-back-btn" class="modal-icon-btn">←</button>
                    <h2>질문 등록</h2>
                </div>
                <button id="close-modal" class="modal-icon-btn">&times;</button>
            </header>
            <form id="qna-form">
                <div class="form-group">
                    <label for="category">카테고리</label>
                    <select id="category" required>
                        <option value="dept">학과 질문</option>
                        <option value="mentor">멘토 가이드</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="department-name">학과명</label>
                    <select id="department-name" required>
                        <option value="">선택해 주세요</option>
                        <!-- MECHANICAL -->
                        <optgroup label="기계공학부">
                            <option value="기계공학과">기계공학과</option>
                            <option value="기계설계공학과">기계설계공학과</option>
                        </optgroup>
                        <!-- ROBOTICS -->
                        <optgroup label="로봇자동화공학부">
                            <option value="자동화공학과">자동화공학과</option>
                            <option value="로봇소프트웨어과">로봇소프트웨어과</option>
                        </optgroup>
                        <!-- COMPUTING -->
                        <optgroup label="컴퓨터소프트웨어공학부">
                            <option value="웹응용소프트웨어공학과">웹응용소프트웨어공학과</option>
                            <option value="컴퓨터소프트웨어공학과">컴퓨터소프트웨어공학과</option>
                            <option value="인공지능소프트웨어학과">인공지능소프트웨어학과</option>
                        </optgroup>
                        <!-- DESIGN -->
                        <optgroup label="디자인학부">
                            <option value="건축과">건축과</option>
                            <option value="실내건축디자인과">실내건축디자인과</option>
                            <option value="시각디자인과">시각디자인과</option>
                            <option value="AR·VR콘텐츠디자인과">AR·VR콘텐츠디자인과</option>
                        </optgroup>
                        <!-- BUSINESS -->
                        <optgroup label="경영학부">
                            <option value="경영학과">경영학과</option>
                            <option value="세무회계학과">세무회계학과</option>
                            <option value="유통마케팅학과">유통마케팅학과</option>
                            <option value="호텔관광학과">호텔관광학과</option>
                        </optgroup>
                    </select>
                </div>
                <div class="form-group">
                    <label for="title">제목</label>
                    <input type="text" id="title" placeholder="제목을 입력하세요" required>
                </div>
                <div class="form-group">
                    <label for="author">작성자</label>
                    <input type="text" id="author" placeholder="이름 또는 ID" required>
                </div>
                <div class="form-group">
                    <label for="content">내용</label>
                    <textarea id="content" rows="5" placeholder="궁금한 내용을 상세히 적어주세요" required></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" id="cancel-modal" class="btn-secondary">뒤로 돌아가기</button>
                    <button type="submit" class="btn-submit">아카이브 등록</button>
                </div>
            </form>
        </div>
    </div>

    <footer style="background:var(--primary); color:rgba(255,255,255,0.6); padding:4rem 0; margin-top:6rem;">
        <div class="container" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:2rem;">
            <div>
                <div class="logo" style="color:white; margin-bottom:1rem;">D-ARCHIVE</div>
                <p style="font-size:0.9rem;">© 2026 D-ARCHIVE. All rights reserved.</p>
            </div>
            <div style="display:flex; gap:2rem; font-size:0.9rem;">
                <a href="#" style="color:inherit; text-decoration:none;">이용약관</a>
                <a href="#" style="color:inherit; text-decoration:none;">개인정보처리방침</a>
                <a href="#" style="color:inherit; text-decoration:none;">고객센터</a>
            </div>
        </div>
    </footer>

    <!-- Firebase SDK (Using v9 Compat for simplicity in script tag) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="app.js"></script>
</body>
</html>
